  <div class="container-xl mt-4">
    <style>

    </style>
    <div class="d-flex align-items-center mb-4">
      <hr class="section-divider-mobile flex-grow-1 border border-secondary opacity-50 me-3">
      <h2 class="section-title-responsive mb-0 text-center" style="white-space:nowrap;">KETERBUKAAN INFORMASI PUBLIK</h2>
      <hr class="section-divider-mobile flex-grow-1 border border-secondary opacity-50 ms-3">
    </div>
    <div class="timeline-horizontal position-relative py-4" style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
          <div class="d-flex flex-row justify-content-center align-items-end" style="gap:24px; min-width:max-content; padding:0 1rem;">
              {% set colors = ['primary', 'success', 'warning', 'danger', 'info', 'secondary'] %}
              {% for info in getInformasiPublik() %}
              <div class="text-center" style="min-width:100px; max-width:120px; flex-shrink:0;">
                <div class="fw-bold mb-2 small">{{ info.title }}</div>
                <div class="position-relative" style="height:24px;">
              <span class="bg-{{ colors[loop.index0 % colors|length] }} rounded-circle d-inline-block" style="width:20px;height:20px;"></span>
              {% if not loop.last %}
              <div style="height:3px;width:80px;background:#bdbdbd;position:absolute;top:8px;left:20px;"></div>
              {% endif %}
                </div>
                <div class="mt-2 text-muted small">
                  {{ info.sub_title }}<br>
                  {% if info.file %}
                    <a href="{{ info.file.getPath() }}" target="_blank" class="btn btn-link btn-sm p-0">Lihat File</a>
                  {% endif %}
                </div>
              </div>
              {% endfor %}
          </div>
    </div>
  </div>
