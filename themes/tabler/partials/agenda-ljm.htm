<div class="container-xl mt-4">
  <div class="d-flex align-items-center mb-4">
    <hr class="flex-grow-1 border border-secondary opacity-50 me-3">
    <h2 class="mb-0 text-center" style="white-space:nowrap;">Agenda LPM</h2>
    <hr class="flex-grow-1 border border-secondary opacity-50 ms-3">
  </div>
  <div class="row">
    {% set agendas = getAgendas(6) %}
    {% for agenda in agendas %}
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">{{ agenda.title }}</h5>
            <p class="text-muted">{{ agenda.description }}</p>
            <div class="small text-secondary">
              <i class="ti ti-calendar me-1"></i>{{ agenda.created_at|date('d M Y') }}
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
