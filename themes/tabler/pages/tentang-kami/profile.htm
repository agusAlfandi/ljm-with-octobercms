url = "/tentang-kami/profile"
title = "Profile"
layout = "app"
==
<div class="container-xl py-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <ul class="nav nav-tabs card-header-tabs" data-bs-toggle="tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <a href="#tabs-visi" class="nav-link active" data-bs-toggle="tab" aria-selected="true" role="tab">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon me-2" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <circle cx="12" cy="12" r="2" />
                            <path d="M22 12c-2.667 4.667 -6 7 -10 7s-7.333 -2.333 -10 -7c2.667 -4.667 6 -7 10 -7s7.333 2.333 10 7" />
                        </svg>
                        Visi
                    </a>
                </li>
                <li class="nav-item" role="presentation">
                    <a href="#tabs-misi" class="nav-link" data-bs-toggle="tab" aria-selected="false" role="tab" tabindex="-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon me-2" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <circle cx="12" cy="12" r=".5" fill="currentColor" />
                            <circle cx="12" cy="12" r="7" />
                            <line x1="12" y1="3" x2="12" y2="5" />
                            <line x1="3" y1="12" x2="5" y2="12" />
                            <line x1="12" y1="19" x2="12" y2="21" />
                            <line x1="19" y1="12" x2="21" y2="12" />
                        </svg>
                        Misi
                    </a>
                </li>
                <li class="nav-item" role="presentation">
                    <a href="#tabs-tujuan" class="nav-link" data-bs-toggle="tab" aria-selected="false" role="tab" tabindex="-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon me-2" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <line x1="5" y1="5" x2="19" y2="5" />
                            <line x1="7" y1="5" x2="7" y2="19" />
                            <path d="M5 19h14" />
                        </svg>
                        Tujuan
                    </a>
                </li>
                <li class="nav-item" role="presentation">
                    <a href="#tabs-sasaran" class="nav-link" data-bs-toggle="tab" aria-selected="false" role="tab" tabindex="-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon me-2" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
                            <path d="M12 7l0 5l3 3" />
                        </svg>
                        Sasaran
                    </a>
                </li>
            </ul>
        </div>
        <div class="card-body">
            <div class="tab-content">
                <div class="tab-pane active show" id="tabs-visi" role="tabpanel">
                    <h4 class="mb-3">Visi</h4>
                    <p class="text-muted text-justify">
                        {% content 'profile/visi.htm' %}
                    </p>
                </div>
                <div class="tab-pane" id="tabs-misi" role="tabpanel">
                    <h4 class="mb-3">Misi</h4>
                    <ol class="text-muted">
                        {% content 'profile/misi.htm' %}
                    </ol>
                </div>
                <div class="tab-pane" id="tabs-tujuan" role="tabpanel">
                    <h4 class="mb-3">Tujuan</h4>
                    <ol class="text-muted">
                        {% content 'profile/tujuan.htm' %}
                    </ol>
                </div>
                <div class="tab-pane" id="tabs-sasaran" role="tabpanel">
                    <h4 class="mb-3">Sasaran</h4>
                    <ol class="text-muted">
                        {% content 'profile/sasaran.htm' %}
                    </ol>
                </div>
            </div>
        </div>
    </div>
</div>
