<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>{% if this.page.title %}{{ this.page.title }}{% else %}Lembaga Penjamin Mutu{% endif %}</title>
    <!-- BEGIN PAGE LEVEL STYLES -->
    <link href="{{ 'assets/libs/jsvectormap/dist/jsvectormap.css'|theme }}?1756745708" rel="stylesheet" />
    <!-- END PAGE LEVEL STYLES -->
    <!-- BEGIN GLOBAL MANDATORY STYLES -->
    <link href="{{ 'assets/css/tabler.css'|theme }}?1756745708" rel="stylesheet" />
    <!-- END GLOBAL MANDATORY STYLES -->
    <!-- BEGIN PLUGINS STYLES -->
    <link href="{{ 'assets/css/tabler-flags.css'|theme }}?1756745708" rel="stylesheet" />
    <link href="{{ 'assets/css/tabler-socials.css'|theme }}?1756745708" rel="stylesheet" />
    <link href="{{ 'assets/css/tabler-payments.css'|theme }}?1756745708" rel="stylesheet" />
    <link href="{{ 'assets/css/tabler-vendors.css'|theme }}?1756745708" rel="stylesheet" />
    <link href="{{ 'assets/css/tabler-marketing.css'|theme }}?1756745708" rel="stylesheet" />
    <link href="{{ 'assets/css/tabler-themes.css'|theme }}?1756745708" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css"/>
    <!-- END PLUGINS STYLES -->
    <!-- BEGIN DEMO STYLES -->
    {# <link href="./preview/css/demo.css?1756745708" rel="stylesheet" /> #}
    <!-- END DEMO STYLES -->
    <!-- BEGIN CUSTOM FONT -->
    <style>
      @import url("https://rsms.me/inter/inter.css");

      /* Prevent horizontal overflow on mobile */
      html, body {
        overflow-x: hidden;
        max-width: 100vw;
        margin: 0;
        padding: 0;
      }

      .page {
        overflow-x: hidden;
        max-width: 100vw;
      }

      /* .container-xl {
        overflow-x: hidden;
      } */

      /* Ensure footer is truly full width */
      /* .footer {
        position: relative !important;
        left: 0 !important;
        right: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        width: 100% !important;
      } */

      /* Hilangkan horizontal scrollbar pada navbar/header */
      /* .navbar {
        overflow-x: hidden !important;
      } */
    </style>
    <!-- END CUSTOM FONT -->
  </head>
  <body>
    <!-- BEGIN GLOBAL THEME SCRIPT -->
    <script src="{{ 'assets/js/tabler-theme.min.js'|theme }}?1756745708"></script>
    <!-- END GLOBAL THEME SCRIPT -->
    <div class="page">

        {# start Header #}
       {% partial 'header' %}
        {# end Header #}

        <!-- BEGIN BREADCRUMB -->
        {% partial 'breadcrumb' %}
        <!-- END BREADCRUMB -->

      <div class="page-wrapper">

        {% if this.page.id == 'home' %}
        {% partial 'page-header' %}
        {% endif %}
        <!-- END PAGE HEADER -->

        <!-- BEGIN PAGE BODY -->
        <div class="page-body">
          <div class="container-xl">
            <div class="row row-deck row-cards">
              {# <div> #}
             {% page %}
              {# </div> #}
            </div>
          </div>
        </div>
        <!-- END PAGE BODY -->

        <!--  BEGIN FOOTER  -->
    {% partial 'footer' %}
        <!--  END FOOTER  -->

      </div>
    </div>

    <!-- BEGIN PAGE LIBRARIES -->
    <script src="{{ 'assets/libs/apexcharts/dist/apexcharts.min.js'|theme }}?1756745708" defer></script>
    <script src="{{ 'assets/libs/jsvectormap/dist/jsvectormap.min.js'|theme }}?1756745708" defer></script>
    <script src="{{ 'assets/libs/jsvectormap/dist/maps/world.js'|theme }}?1756745708" defer></script>
    <script src="{{ 'assets/libs/jsvectormap/dist/maps/world-merc.js'|theme }}?1756745708" defer></script>

    <!-- jQuery (MUST BE LOADED FIRST) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

    <!-- END PAGE LIBRARIES -->
    <!-- BEGIN GLOBAL MANDATORY SCRIPTS -->
    <script src="{{ 'assets/js/tabler.min.js'|theme }}?1756745708" defer></script>
    <!-- END GLOBAL MANDATORY SCRIPTS -->
    <!-- BEGIN DEMO SCRIPTS -->
    {# <script src="./preview/js/demo.min.js?1756745708" defer></script> #}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/masonry/4.2.2/masonry.pkgd.min.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var grid = document.querySelector('[data-masonry]');
          if (grid && typeof Masonry !== 'undefined') {
            var msnry = new Masonry(grid, {
              itemSelector: '.col-sm-6',
              percentPosition: true
            });

            // Re-layout after short delay
            setTimeout(function() {
              msnry.layout();
            }, 200);
          }
        }, 100);
      });
    </script>

</body>
</html>
