fields:
    title:
        label: Judul Dokumen
        span: full
        type: text
        placeholder: 'Contoh: Monev-Dosen-2024-2025'
        comment: Nama file yang akan diupload ke Google Drive (tanpa ekstensi .pdf)
        required: true

    category:
        label: Kategori
        span: full
        type: dropdown
        placeholder: '-- Pilih Kategori --'
        options: Agus\Tabler\Models\Monev::getCategoryOptions
        required: true
        comment: File akan diupload ke folder Google Drive sesuai kategori yang dipilih

    file_name:
        label: File yang Sudah Diupload
        span: full
        type: text
        disabled: true
        comment: Nama file yang sudah diupload ke Google Drive (readonly)

    file:
        label: Upload File PDF Baru
        span: full
        type: fileupload
        mode: file
        fileTypes: pdf
        maxFilesize: 10
        useCaption: false
        thumbOptions:
            mode: crop
            extension: auto
        comment: Upload file PDF baru (maksimal 10MB). File akan otomatis diupload ke Google Drive dan mengganti file lama.
