columns:
    title:
        label: 'Judul Dokumen'
        type: text
        searchable: true
    category:
        label: Kategori
        type: text
        valueFrom: display_category
        sortable: true
        searchable: false
    file:
        label: 'File PDF'
        type: text
        select: file_name
        relation: file
        searchable: false
    created_at:
        label: Dibuat
        type: datetime
        format: 'd M Y H:i'
        width: 150px
    updated_at:
        label: Diperbarui
        type: datetime
        format: 'd M Y H:i'
        width: 150px
