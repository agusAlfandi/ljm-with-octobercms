fields:
    file:
        label: 'Upload File PDF'
        mode: file
        fileTypes: pdf
        maxFilesize: 20
        useCaption: false
        thumbOptions:
            mode: crop
            extension: auto
        span: full
        type: fileupload
        comment: 'Upload file PDF (maksimal 20MB). Nama file akan otomatis mengisi judul dokumen.'
        attributes:
            data-request: onFileUpload
    title:
        label: 'Judul Dokumen'
        span: full
        type: text
        placeholder: 'Otomatis terisi dari nama file PDF'
        comment: 'Nama file yang akan diupload ke Google Drive (akan otomatis terisi dari file yang diupload, bisa diedit manual)'
        required: true
    level:
        label: Level
        span: left
        type: dropdown
        placeholder: '-- Pilih Level --'
        options: getLevelOptions
        required: true
        comment: 'Pilih level RTM: Prodi, Fakultas, atau Universitas'
    fakultas:
        label: Fakultas
        span: right
        type: dropdown
        placeholder: '-- Pilih Fakultas --'
        dependsOn: [level]
        options: getFakultasOptions
        comment: 'Pilih Fakultas (hanya untuk level Fakultas)'
        cssClass: hide
        trigger:
            action: show
            field: level
            condition: value[Fakultas]
    periode:
        label: Periode
        span: left
        type: dropdown
        placeholder: '-- Pilih Periode --'
        options: getPeriodeOptions
        required: true
        comment: 'Pilih periode dokumen RTM'
    prodi:
        label: Prodi
        span: right
        type: dropdown
        placeholder: '-- Pilih Prodi --'
        dependsOn: [periode, level, fakultas]
        options: getProdiOptions
        comment: 'Pilih prodi dokumen RTM. Daftar prodi diambil otomatis dari folder periode yang dipilih.'
        trigger:
            action: hide
            field: level
            condition: value[Universitas]
    file_name:
        label: 'File yang Sudah Diupload'
        span: full
        disabled: true
        type: text
        comment: 'Nama file yang sudah diupload ke Google Drive (readonly)'
