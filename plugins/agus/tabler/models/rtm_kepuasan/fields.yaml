fields:
    file:
        label: 'Upload File PDF'
        mode: file
        fileTypes: pdf
        maxFilesize: 20
        useCaption: false
        thumbOptions:
            mode: crop
            extension: auto
        span: full
        type: fileupload
        comment: 'Upload file PDF (maksimal 20MB). Nama file akan otomatis mengisi judul dokumen.'
        attributes:
            data-request: onFileUpload
    title:
        label: 'Judul Dokumen'
        span: full
        type: text
        placeholder: 'Otomatis terisi dari nama file PDF'
        comment: 'Nama file yang akan diupload ke Google Drive (akan otomatis terisi dari file yang diupload, bisa diedit manual)'
        required: true
    periode:
        label: Periode
        span: left
        type: dropdown
        placeholder: '-- Pilih Periode --'
        options: getPeriodeOptions
        required: true
        comment: 'Pilih periode dokumen RTM Kepuasan'
    prodi:
        label: Prodi
        span: right
        type: dropdown
        placeholder: '-- Pilih Prodi --'
        dependsOn: [periode]
        options: getProdiOptions
        required: true
        comment: 'Pilih prodi dokumen RTM Kepuasan.'
    file_name:
        label: 'File yang Sudah Diupload'
        span: full
        disabled: true
        type: text
        comment: 'Nama file yang sudah diupload ke Google Drive (readonly)'
